[project]
name = "tinyshop"
version = "0.6.0"
description = "A small e-commerce backend used to exercise documentation drift detection."
authors = [{ name = "TruthGap" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "click>=8.1.7",
  "httpx>=0.27.0",
  "pyjwt>=2.9.0",
]

[project.scripts]
tinyshop = "tinyshop.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
