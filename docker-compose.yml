services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: truthgap-postgres
    environment:
      POSTGRES_USER: truthgap
      POSTGRES_PASSWORD: truthgap
      POSTGRES_DB: truthgap
    ports:
      - "5434:5432"
    volumes:
      - truthgap_pgdata:/var/lib/postgresql/data

volumes:
  truthgap_pgdata:
